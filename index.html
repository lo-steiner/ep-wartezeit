<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa-Park Wartezeiten Live</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Icons
        const ClockIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const RefreshIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>;
        const SearchIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const MapPinIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>;
        const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
        const InfoIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;

        const API_URL = 'https://queue-times.com/parks/51/queue_times.json';

        function App() {
            const [rides, setRides] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [lastUpdated, setLastUpdated] = useState(null);
            
            const [searchTerm, setSearchTerm] = useState('');
            const [sortBy, setSortBy] = useState('wait_asc');

            const fetchWaitTimes = async () => {
                setLoading(true);
                setError(null);
                try {
                    let response;
                    let data;

                    // Proxy-Fallbacks um CORS zu umgehen
                    try {
                        response = await fetch(`https://corsproxy.io/?${encodeURIComponent(API_URL)}`);
                        if (!response.ok) throw new Error('Proxy 1 fehlgeschlagen');
                        data = await response.json();
                    } catch (e) {
                        console.log("Proxy 1 gescheitert, probiere Proxy 2...");
                        response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(API_URL)}`);
                        if (!response.ok) throw new Error('Beide Proxies fehlgeschlagen');
                        data = await response.json();
                    }
                    
                    let allRides = [];
                    
                    if (data.lands) {
                        data.lands.forEach(land => {
                            land.rides.forEach(ride => {
                                allRides.push({
                                    id: ride.id,
                                    name: ride.name,
                                    isOpen: ride.is_open,
                                    waitTime: ride.wait_time,
                                    land: land.name,
                                    lastUpdate: ride.last_updated
                                });
                            });
                        });
                    }
                    
                    if (data.rides) {
                        data.rides.forEach(ride => {
                            allRides.push({
                                id: ride.id,
                                name: ride.name,
                                isOpen: ride.is_open,
                                waitTime: ride.wait_time,
                                land: 'Allgemein',
                                lastUpdate: ride.last_updated
                            });
                        });
                    }

                    setRides(allRides);
                    setLastUpdated(new Date());
                    setError(null);
                } catch (err) {
                    console.error("API Fehler:", err);
                    setError("Verbindung zum Live-Server momentan blockiert. Zeige Demo-Daten.");
                    loadMockData();
                } finally {
                    setLoading(false);
                }
            };

            const loadMockData = () => {
                const mockRides = [
                    { id: 1, name: "Blue Fire Megacoaster", isOpen: true, waitTime: 45, land: "Island" },
                    { id: 2, name: "WODAN - Timburcoaster", isOpen: true, waitTime: 60, land: "Island" },
                    { id: 3, name: "Silver Star", isOpen: true, waitTime: 35, land: "Frankreich" },
                    { id: 4, name: "Eurosat - CanCan Coaster", isOpen: true, waitTime: 20, land: "Frankreich" },
                    { id: 5, name: "Arthur", isOpen: true, waitTime: 50, land: "Königreich der Minimoys" },
                    { id: 6, name: "Schweizer Bobbahn", isOpen: true, waitTime: 15, land: "Schweiz" },
                    { id: 7, name: "Euro-Mir", isOpen: true, waitTime: 25, land: "Russland" },
                    { id: 8, name: "Voltron Nevera", isOpen: true, waitTime: 85, land: "Kroatien" },
                    { id: 9, name: "Piraten in Batavia", isOpen: true, waitTime: 5, land: "Niederlande" },
                    { id: 10, name: "Tiroler Wildwasserbahn", isOpen: false, waitTime: 0, land: "Österreich" },
                ];
                setRides(mockRides);
                setLastUpdated(new Date());
            };

            useEffect(() => {
                fetchWaitTimes();
                // Update alle 5 Minuten, wie in den API Docs empfohlen
                const interval = setInterval(fetchWaitTimes, 5 * 60 * 1000);
                return () => clearInterval(interval);
            }, []);

            const filteredAndSortedRides = useMemo(() => {
                let result = rides.filter(ride => 
                    ride.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    ride.land.toLowerCase().includes(searchTerm.toLowerCase())
                );

                result.sort((a, b) => {
                    if (a.isOpen !== b.isOpen) return a.isOpen ? -1 : 1;
                    
                    switch (sortBy) {
                        case 'wait_asc': return a.waitTime - b.waitTime;
                        case 'wait_desc': return b.waitTime - a.waitTime;
                        case 'name': return a.name.localeCompare(b.name);
                        default: return 0;
                    }
                });
                return result;
            }, [rides, searchTerm, sortBy]);

            const getWaitTimeBadge = (isOpen, waitTime) => {
                if (!isOpen) return <span className="px-3 py-1 bg-gray-200 text-gray-600 rounded-full font-bold text-sm">Geschlossen</span>;
                
                let colorClass = 'bg-green-500';
                if (waitTime > 15) colorClass = 'bg-yellow-500 text-gray-900';
                if (waitTime > 40) colorClass = 'bg-red-500';

                return (
                    <span className={`px-3 py-1 ${colorClass} text-white rounded-full font-bold text-lg shadow-sm flex items-center gap-1`}>
                        <ClockIcon />
                        {waitTime} <span className="text-sm font-medium">Min.</span>
                    </span>
                );
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white p-5 shadow-lg shrink-0">
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="text-center md:text-left">
                                <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight flex items-center justify-center md:justify-start gap-2">
                                    <span className="text-yellow-400 text-3xl">★</span> EP Wartezeiten
                                </h1>
                            </div>
                            <button 
                                onClick={fetchWaitTimes}
                                disabled={loading}
                                className="flex items-center gap-2 bg-white/10 active:bg-white/20 px-4 py-2 rounded-lg transition-all border border-white/20"
                            >
                                <RefreshIcon className={loading ? 'animate-spin' : ''} />
                                {loading ? 'Lädt...' : 'Update'}
                            </button>
                        </div>
                    </header>

                    {/* Main Content (flex-grow fills available space) */}
                    <main className="max-w-6xl mx-auto p-4 flex-grow w-full">
                        {error && (
                            <div className="mb-6 p-3 bg-amber-50 border-l-4 border-amber-500 text-amber-800 rounded-r-lg flex items-start gap-3 text-sm">
                                <div className="mt-0.5"><InfoIcon /></div>
                                <p>{error}</p>
                            </div>
                        )}

                        {/* Controls */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col gap-3">
                            <div className="relative w-full">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <SearchIcon />
                                </div>
                                <input
                                    type="text"
                                    placeholder="Suchen (z.B. Silver Star)..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="pl-10 w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                            </div>

                            <div className="flex gap-2 w-full overflow-x-auto pb-2 snap-x">
                                <button
                                    onClick={() => setSortBy('wait_asc')}
                                    className={`snap-start whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium border ${sortBy === 'wait_asc' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                                >
                                    ↓ Beste Zeit
                                </button>
                                <button
                                    onClick={() => setSortBy('wait_desc')}
                                    className={`snap-start whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium border ${sortBy === 'wait_desc' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                                >
                                    ↑ Längste Zeit
                                </button>
                                <button
                                    onClick={() => setSortBy('name')}
                                    className={`snap-start whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium border ${sortBy === 'name' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                                >
                                    A-Z Name
                                </button>
                            </div>
                        </div>

                        <div className="flex justify-between items-end mb-4 px-1">
                            <h2 className="text-sm font-semibold text-slate-600">
                                {filteredAndSortedRides.length} Treffer
                            </h2>
                            {lastUpdated && (
                                <span className="text-xs text-slate-400">
                                    Stand: {lastUpdated.toLocaleTimeString('de-DE').slice(0,5)}
                                </span>
                            )}
                        </div>

                        {loading && rides.length === 0 ? (
                            <div className="grid grid-cols-1 gap-3">
                                {[1, 2, 3, 4].map(i => <div key={i} className="bg-white h-24 rounded-xl animate-pulse border border-slate-100"></div>)}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                {filteredAndSortedRides.map((ride) => (
                                    <div key={ride.id} className={`relative overflow-hidden rounded-xl border p-4 bg-white shadow-sm flex flex-col justify-between ${!ride.isOpen ? 'opacity-70' : ''}`}>
                                        <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${!ride.isOpen ? 'bg-gray-400' : ride.waitTime <= 15 ? 'bg-green-500' : ride.waitTime <= 40 ? 'bg-yellow-500' : 'bg-red-500'}`}></div>
                                        
                                        <div className="pl-2">
                                            <div className="flex justify-between items-start gap-2 mb-2">
                                                <h3 className="font-bold text-slate-800 text-lg leading-tight pr-2">
                                                    {ride.name}
                                                </h3>
                                                <div className="shrink-0">
                                                    {getWaitTimeBadge(ride.isOpen, ride.waitTime)}
                                                </div>
                                            </div>
                                            
                                            <div className="flex items-center gap-1.5 text-sm text-slate-500 mt-3">
                                                <MapPinIcon />
                                                <span>{ride.land}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                
                                {filteredAndSortedRides.length === 0 && !loading && (
                                    <div className="col-span-full py-10 text-center text-slate-400 bg-white rounded-xl border border-slate-200">
                                        <div className="flex justify-center mb-2 opacity-30"><AlertIcon /></div>
                                        <p>Nichts gefunden.</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Attribution Footer (Obligatorisch laut API Docs) */}
                    <footer className="mt-8 py-6 text-center text-slate-500 text-sm border-t border-slate-200 shrink-0">
                        Powered by <a href="https://queue-times.com/de" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 font-semibold transition-colors">Queue-Times.com</a>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
